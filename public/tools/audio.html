<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>xAudio - Chỉnh sửa âm thanh</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"Segoe UI", sans-serif; background:#1a1a1a; color:#e0e0e0; height:100vh; display:flex; flex-direction:column; }
        .topbar { height:40px; background:#00d69c; color:black; display:flex; align-items:center; padding:0 12px; gap:8px; font-size:13px; font-weight:600; }
        .workspace { flex:1; display:flex; flex-direction:column; padding:20px; gap:20px; }
        .waveform { flex:1; background:#262626; border-radius:8px; position:relative; overflow:hidden; }
        .waveform-canvas { width:100%; height:200px; background:linear-gradient(180deg, #1a1a1a, #0d0d0d); position:relative; }
        .waveform-visual { position:absolute; inset:0; display:flex; align-items:center; gap:2px; padding:0 10px; }
        .wave-bar { width:3px; background:#00d69c; border-radius:2px; flex:1; }
        .controls { display:flex; align-items:center; justify-content:center; gap:16px; padding:16px; background:#262626; border-radius:8px; }
        .ctrl-btn { width:44px; height:44px; border-radius:50%; border:none; background:#333; color:white; font-size:18px; cursor:pointer; }
        .ctrl-btn.play { background:#00d69c; color:black; width:52px; height:52px; font-size:22px; }
        .tracks { background:#262626; border-radius:8px; padding:16px; }
        .track { height:60px; background:#1a1a1a; border-radius:6px; margin-bottom:8px; display:flex; align-items:center; padding:0 10px; gap:10px; position:relative; }
        .track-name { width:120px; font-size:12px; color:#aaa; }
        .track-wave { flex:1; height:40px; background:linear-gradient(90deg, #00d69c, #00a87a); border-radius:4px; opacity:0.6; }
        .track.audio .track-wave { background:linear-gradient(90deg, #00d69c, #00e5b8); }
        .track.mic .track-wave { background:linear-gradient(90deg, #f59e0b, #d97706); }
        .effects-panel { display:flex; gap:8px; padding:12px; background:#262626; border-radius:8px; }
        .effect-btn { padding:8px 14px; background:#333; border:none; color:white; border-radius:6px; cursor:pointer; font-size:12px; }
        .effect-btn:hover { background:#00d69c; color:black; }
    </style>
</head>
<body>
    <div class="topbar">
        <span>🎵 xAudio CC</span>
        <div style="margin-left:auto; display:flex; gap:8px; font-weight:normal;">
            <button style="padding:4px 12px; background:black; color:#00d69c; border:none; border-radius:4px; cursor:pointer;">✨ AI Khử ồn</button>
        </div>
    </div>
    <div class="workspace">
        <div class="waveform">
            <div style="padding:16px; font-size:13px; color:#aaa;">Waveform Editor</div>
            <div class="waveform-canvas">
                <div class="waveform-visual" id="waveVis"></div>
            </div>
        </div>
        <div class="controls">
            <button class="ctrl-btn">⏮</button>
            <button class="ctrl-btn">⏪</button>
            <button class="ctrl-btn play" onclick="this.textContent = this.textContent === '▶' ? '⏸' : '▶'">▶</button>
            <button class="ctrl-btn">⏩</button>
            <button class="ctrl-btn">⏺️</button>
            <span style="font-family:monospace; margin:0 16px;">00:00:00 / 00:03:45</span>
            <input type="range" style="flex:1; max-width:300px;">
        </div>
        <div class="effects-panel">
            <button class="effect-btn">🔇 Khử ồn</button>
            <button class="effect-btn">📢 Chuẩn hóa âm lượng</button>
            <button class="effect-btn">🎚️ EQ</button>
            <button class="effect-btn">🎤 Auto Tune</button>
            <button class="effect-btn">🎵 Nhạc nền</button>
            <button class="effect-btn">✂️ Cắt</button>
        </div>
        <div class="tracks">
            <div class="track audio">
                <span class="track-name">🎵 Nhạc nền</span>
                <div class="track-wave"></div>
            </div>
            <div class="track mic">
                <span class="track-name">🎤 Giọng nói</span>
                <div class="track-wave" style="width:60%;"></div>
            </div>
        </div>
    </div>
    <script>
        const waveVis = document.getElementById('waveVis');
        for (let i = 0; i < 200; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.height = (Math.random()*160+10) + 'px';
            waveVis.appendChild(bar);
        }
    </script>
</body>
</html>
