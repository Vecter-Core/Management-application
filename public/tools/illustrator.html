<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>xVector - Vẽ Vector Illustrator</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"Segoe UI", sans-serif; background:#262626; color:white; height:100vh; display:flex; flex-direction:column; }
        .topbar { height:40px; background:#ff9a00; color:#330000; display:flex; align-items:center; padding:0 12px; font-size:13px; font-weight:600; gap:8px; }
        .menubar { display:flex; gap:4px; margin-left:10px; font-weight:400; }
        .menu-item { padding:6px 10px; border-radius:4px; cursor:pointer; color:#220000; }
        .menu-item:hover { background:rgba(0,0,0,0.1); }
        
        .workspace { flex:1; display:flex; }
        .left-tools { width:56px; background:#333; padding:8px; display:grid; gap:2px; }
        .tool-btn { width:40px; height:40px; border-radius:4px; border:none; background:transparent; color:white; font-size:18px; cursor:pointer; }
        .tool-btn:hover { background:#444; }
        .tool-btn.active { background:#ff9a00; color:#330000; }
        
        .artboard-area { flex:1; background:#444; background-image:linear-gradient(45deg,#3d3d3d 25%,transparent 25%),linear-gradient(-45deg,#3d3d3d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3d3d3d 75%),linear-gradient(-45deg,transparent 75%,#3d3d3d 75%); background-size:20px 20px; display:flex; align-items:center; justify-content:center; overflow:auto; }
        #vectorCanvas { background:white; box-shadow:0 0 40px rgba(0,0,0,0.5); cursor:crosshair; }
        
        .right-panel { width:260px; background:#333; padding:12px; border-left:1px solid #444; overflow-y:auto; }
        .panel-section { margin-bottom:16px; }
        .panel-title { font-size:11px; text-transform:uppercase; color:#999; margin-bottom:8px; font-weight:600; letter-spacing:0.5px; }
        .color-stops { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; }
        .color-swatch { width:28px; height:28px; border-radius:4px; cursor:pointer; border:2px solid transparent; }
        .color-swatch:hover { border-color:white; }
        .stroke-options { display:flex; flex-direction:column; gap:8px; }
        .slider-row { display:flex; align-items:center; gap:8px; font-size:12px; }
        .slider-row input { flex:1; accent-color:#ff9a00; }
        
        .layers-panel { margin-top:16px; }
        .vector-layer { padding:6px 8px; background:#404040; border-radius:4px; margin-bottom:4px; font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer; }
        .vector-layer.active { border-left:3px solid #ff9a00; }
        
        .statusbar { height:22px; background:#ff9a00; color:#330000; font-size:12px; display:flex; align-items:center; padding:0 12px; gap:20px; font-weight:500; }
    </style>
</head>
<body>
    <div class="topbar">
        <span>⬡ xVector CC 2026</span>
        <div class="menubar">
            <div class="menu-item">Tệp</div>
            <div class="menu-item">Chỉnh sửa</div>
            <div class="menu-item">Đối tượng</div>
            <div class="menu-item">Kiểu chữ</div>
            <div class="menu-item">Lựa chọn</div>
            <div class="menu-item">Hiệu ứng</div>
            <div class="menu-item">Xem</div>
            <div class="menu-item">Cửa sổ</div>
        </div>
        <div style="margin-left:auto; font-size:12px; font-weight:400;">✨ AI Vectorize | SVG Export</div>
    </div>

    <div class="workspace">
        <div class="left-tools">
            <button class="tool-btn active" title="Selection (V)">🖱️</button>
            <button class="tool-btn" title="Direct Selection (A)">⇱</button>
            <button class="tool-btn" title="Pen Tool (P)">🖋️</button>
            <button class="tool-btn" title="Type Tool (T)">T</button>
            <button class="tool-btn" title="Shape Tool (M)">▢</button>
            <button class="tool-btn" title="Ellipse (L)">○</button>
            <button class="tool-btn" title="Polygon">⬟</button>
            <button class="tool-btn" title="Line">\</button>
            <button class="tool-btn" title="Brush (B)">🖌️</button>
            <button class="tool-btn" title="Pencil (N)">✏️</button>
            <button class="tool-btn" title="Eyedropper (I)">💧</button>
            <button class="tool-btn" title="Eraser">🧽</button>
            <button class="tool-btn" title="Rotate">🔄</button>
            <button class="tool-btn" title="Scale">📐</button>
            <button class="tool-btn" title="Gradient">🌈</button>
            <button class="tool-btn" title="Mesh">🕸️</button>
        </div>

        <div class="artboard-area">
            <canvas id="vectorCanvas" width="800" height="600"></canvas>
        </div>

        <div class="right-panel">
            <div class="panel-section">
                <div class="panel-title">Màu nền</div>
                <div style="display:flex; gap:8px; margin-bottom:8px;">
                    <input type="color" value="#ff9a00" style="width:60px; height:40px; border:none; border-radius:4px; cursor:pointer;">
                    <input type="color" value="transparent" style="width:60px; height:40px; border:none; border-radius:4px; cursor:pointer;">
                </div>
                <div class="panel-title" style="margin-top:12px;">Swatches</div>
                <div class="color-stops">
                    <div class="color-swatch" style="background:#000000"></div>
                    <div class="color-swatch" style="background:#ffffff; border:1px solid #666;"></div>
                    <div class="color-swatch" style="background:#ef4444"></div>
                    <div class="color-swatch" style="background:#f59e0b"></div>
                    <div class="color-swatch" style="background:#eab308"></div>
                    <div class="color-swatch" style="background:#22c55e"></div>
                    <div class="color-swatch" style="background:#06b6d4"></div>
                    <div class="color-swatch" style="background:#3b82f6"></div>
                    <div class="color-swatch" style="background:#8b5cf6"></div>
                    <div class="color-swatch" style="background:#ec4899"></div>
                    <div class="color-swatch" style="background:#ff9a00"></div>
                    <div class="color-swatch" style="background:#78716c"></div>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">Stroke</div>
                <div class="stroke-options">
                    <div class="slider-row"><span style="width:60px;">Weight:</span><input type="range" min="0" max="40" value="2"><span>2pt</span></div>
                    <div style="display:flex; gap:4px;">
                        <button style="flex:1; padding:6px; background:#444; border:1px solid #555; color:white; border-radius:4px; cursor:pointer;">—</button>
                        <button style="flex:1; padding:6px; background:#2a2a2a; border:1px solid #555; color:white; border-radius:4px; cursor:pointer;">- -</button>
                        <button style="flex:1; padding:6px; background:#2a2a2a; border:1px solid #555; color:white; border-radius:4px; cursor:pointer;">···</button>
                    </div>
                    <div style="display:flex; gap:4px;">
                        <button style="flex:1; padding:6px; background:#444; border:1px solid #555; color:white; border-radius:4px; cursor:pointer;">Miter</button>
                        <button style="flex:1; padding:6px; background:#2a2a2a; border:1px solid #555; color:white; border-radius:4px; cursor:pointer;">Round</button>
                        <button style="flex:1; padding:6px; background:#2a2a2a; border:1px solid #555; color:white; border-radius:4px; cursor:pointer;">Bevel</button>
                    </div>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">Transform</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12px;">
                    <div><label style="color:#999;">X:</label><input type="number" value="0" style="width:100%; background:#2a2a2a; border:1px solid #444; color:white; padding:4px; border-radius:4px; margin-top:4px;"></div>
                    <div><label style="color:#999;">Y:</label><input type="number" value="0" style="width:100%; background:#2a2a2a; border:1px solid #444; color:white; padding:4px; border-radius:4px; margin-top:4px;"></div>
                    <div><label style="color:#999;">W:</label><input type="number" value="200" style="width:100%; background:#2a2a2a; border:1px solid #444; color:white; padding:4px; border-radius:4px; margin-top:4px;"></div>
                    <div><label style="color:#999;">H:</label><input type="number" value="200" style="width:100%; background:#2a2a2a; border:1px solid #444; color:white; padding:4px; border-radius:4px; margin-top:4px;"></div>
                    <div><label style="color:#999;">Rotate:</label><input type="number" value="0" style="width:100%; background:#2a2a2a; border:1px solid #444; color:white; padding:4px; border-radius:4px; margin-top:4px;"></div>
                    <div><label style="color:#999;">Opacity:</label><input type="number" value="100" style="width:100%; background:#2a2a2a; border:1px solid #444; color:white; padding:4px; border-radius:4px; margin-top:4px;"></div>
                </div>
            </div>

            <div class="panel-section layers-panel">
                <div class="panel-title">Layers</div>
                <div class="vector-layer active"><span>👁️</span> <span>Layer 1</span></div>
                <div class="vector-layer"><span>👁️</span> <span>Path 1</span></div>
                <div class="vector-layer"><span>👁️</span> <span>Text</span></div>
            </div>
        </div>
    </div>

    <div class="statusbar">
        <span>Artboard 1: 800×600 px</span>
        <span>Zoom: 100%</span>
        <span>Tool: Selection</span>
        <span style="margin-left:auto;">📐 Vector graphics - Xuất SVG, AI, EPS, PDF</span>
    </div>

    <script>
        const c = document.getElementById('vectorCanvas');
        const ctx = c.getContext('2d');
        // Draw sample vector shapes
        ctx.fillStyle = '#ff9a00';
        ctx.beginPath(); ctx.moveTo(200, 150); ctx.lineTo(300, 300); ctx.lineTo(100, 300); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath(); ctx.arc(500, 250, 100, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.strokeRect(350, 400, 200, 100);
        ctx.fillStyle = '#000'; ctx.font = 'bold 36px Arial'; ctx.fillText('xVector', 300, 350);
    </script>
</body>
</html>
